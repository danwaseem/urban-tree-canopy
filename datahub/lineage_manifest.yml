# DataHub lineage manifest — Urban Tree Canopy pipeline
#
# Documents the end-to-end data lineage from source CSV through PostGIS,
# dbt transformations, and Parquet export to S3.
#
# This file can be consumed by datahub-ingestion (file source type) or
# referenced in dbt's sources.yml via the meta.datahub_urn field.

datasets:

  - urn: "urn:li:dataset:(urn:li:dataPlatform:file,nyc_tree_census_2015.csv,PROD)"
    name: nyc_tree_census_2015.csv
    description: >
      NYC 2015 Street Tree Census — 683 788 street trees across all five boroughs.
      Downloaded from NYC Open Data (views/uvpi-gqnh). Ingested by fetch_tree_data.py.
    platform: file
    upstream_lineage: []

  - urn: "urn:li:dataset:(urn:li:dataPlatform:file,nyc_ndvi_synthetic.tif,PROD)"
    name: nyc_ndvi_synthetic.tif
    description: >
      Synthetic single-band NDVI GeoTIFF (EPSG:4326) covering the NYC bounding box.
      Generated by fetch_ndvi.py. Replace with real satellite-derived NDVI in production.
    platform: file
    upstream_lineage: []

  - urn: "urn:li:dataset:(urn:li:dataPlatform:postgres,treecanopy.raw.tree_census,PROD)"
    name: raw.tree_census
    description: >
      100 000 street trees loaded by process_and_load.py. Includes NDVI values sampled
      at EPSG:4326 point locations, projected coordinates in EPSG:32618 (x_32618/y_32618),
      census tract assignment from a synthetic grid spatial join, and a loaded_at ingestion
      timestamp used by dbt source freshness checks.
    platform: postgres
    upstream_lineage:
      - "urn:li:dataset:(urn:li:dataPlatform:file,nyc_tree_census_2015.csv,PROD)"
      - "urn:li:dataset:(urn:li:dataPlatform:file,nyc_ndvi_synthetic.tif,PROD)"

  - urn: "urn:li:dataset:(urn:li:dataPlatform:postgres,treecanopy.analytics.stg_tree_census,PROD)"
    name: analytics.stg_tree_census
    description: >
      dbt staging view. Filters to living trees (status = 'alive'), casts all columns to
      canonical types, normalises health and species names to lowercase, and derives boroname
      from the borough source column. 36+ dbt schema tests enforced on every refresh.
    platform: postgres
    upstream_lineage:
      - "urn:li:dataset:(urn:li:dataPlatform:postgres,treecanopy.raw.tree_census,PROD)"

  - urn: "urn:li:dataset:(urn:li:dataPlatform:postgres,treecanopy.analytics.mart_canopy_coverage,PROD)"
    name: analytics.mart_canopy_coverage
    description: >
      dbt mart table. One row per (census_tract_id, boroname). Aggregates tree count,
      mean NDVI, species richness, mean DBH, and a canopy density proxy score.
      Grain: census tract × borough.
    platform: postgres
    upstream_lineage:
      - "urn:li:dataset:(urn:li:dataPlatform:postgres,treecanopy.analytics.stg_tree_census,PROD)"

  - urn: "urn:li:dataset:(urn:li:dataPlatform:postgres,treecanopy.analytics.mart_species_health,PROD)"
    name: analytics.mart_species_health
    description: >
      dbt mart table. One row per (spc_common, health). Aggregates tree count, mean NDVI,
      mean DBH, and carries the Latin species name for ecological reference.
      Grain: species × health rating.
    platform: postgres
    upstream_lineage:
      - "urn:li:dataset:(urn:li:dataPlatform:postgres,treecanopy.analytics.stg_tree_census,PROD)"

  - urn: "urn:li:dataset:(urn:li:dataPlatform:s3,tree-canopy-bucket/marts/mart_canopy_coverage.parquet,PROD)"
    name: "s3://tree-canopy-bucket/marts/mart_canopy_coverage.parquet"
    description: >
      Parquet export of mart_canopy_coverage for downstream querying via AWS Athena (Trino)
      or DuckDB. Written by the Airflow export_parquet task. Locally mocked at
      data/mock_s3/marts/mart_canopy_coverage.parquet.
    platform: s3
    upstream_lineage:
      - "urn:li:dataset:(urn:li:dataPlatform:postgres,treecanopy.analytics.mart_canopy_coverage,PROD)"
